name: AI 동향 보고서 자동 생성

on:
  schedule:
    - cron: '0 3 * * *'   # 매일 KST 12:00 (UTC 03:00)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 시스템 의존성 설치 (WeasyPrint + 한글 폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libgdk-pixbuf2.0-0 libffi-dev \
            fonts-nanum fonts-nanum-coding

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 보고서 생성
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ai_report_generator.py

      - name: 보고서 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "docs: AI 동향 보고서 $(date +'%Y-%m-%d')"
          git push
